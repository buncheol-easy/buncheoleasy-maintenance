<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>분철이지 — 서비스 점검 중</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f7e6;color:#111;
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;padding:24px}
  .card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:36px 28px;box-shadow:0 8px 30px rgba(77,97,23,.08);text-align:center}
  .logo{display:block;height:84px;margin:0 auto 16px}
  .badge{display:inline-block;background:#d7ff5f;color:#111;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;margin-bottom:16px}
  h1{font-size:22px;line-height:1.4;margin-bottom:14px}
  p{font-size:15px;line-height:1.7;color:#444}
  p+p{margin-top:8px}
  .safe{margin-top:20px;background:#f3f7e6;border-radius:12px;padding:14px;font-size:14px;color:#4d6117;font-weight:600}
  .actions{margin-top:24px;display:flex;flex-direction:column;gap:10px}
  .btn{display:block;text-decoration:none;font-weight:700;font-size:15px;padding:14px;border-radius:12px}
  .btn.x{background:#111;color:#fff}
  .btn.mail{background:#fff;color:#111;border:1px solid #ddd}
  .btn small{display:block;font-weight:500;font-size:13px;color:#666;margin-top:2px}
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/logo.png" alt="분철이지">
    <div class="badge">점검 중</div>
    <h1>잠시 서비스를 멈췄어요</h1>
    <p>서버 문제로 분철이지를 잠시 쉬고 있어요.<br>최대한 빨리 다시 열게요.</p>
    <p>다시 열면 공식 X 계정에서 먼저 알려 드릴게요.</p>
    <div class="safe">신청·입금 기록은 안전하게 보관하고 있어요.</div>
    <div class="actions">
      <a class="btn x" href="https://x.com/BuncheolEasy" target="_blank" rel="noopener">공식 X 계정 보기</a>
      <a class="btn mail" href="mailto:contact@buncheoleasy.com">문의하기<small>contact@buncheoleasy.com</small></a>
    </div>
  </main>
</body>
</html>
